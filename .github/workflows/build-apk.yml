name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../DeepLog-Pro.apk

      - name: Upload Ready-to-Install Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepLog-Pro-Android-APK
          path: DeepLog-Pro.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "DeepLog Pro Android APK (Build #${{ github.run_number }})"
          body: "Tap **DeepLog-Pro.apk** under Assets below on your Android phone to download and install the native app directly."
          files: DeepLog-Pro.apk
